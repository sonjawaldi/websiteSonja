<div>
  <form
    action="https://formsubmit.co/business@sonjawaldenspuhl.de"
    method="POST"
    class="space-y-3 sm:space-y-4"
  >
    <input type="hidden" name="_subject" [value]="subject()" />
    <input type="hidden" name="_template" value="table" />
    <input type="hidden" name="_next" value="https://sonjawaldenspuhl.de/#contact" />
    <div class="grid gap-3 sm:grid-cols-2 sm:gap-4">
      <div>
        <label for="contact-name" class="mb-1.5 block text-sm font-bold">Name *</label>
        <input
          id="contact-name"
          name="name"
          type="text"
          required
          autocomplete="name"
          placeholder="Dein Name"
          class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100 dark:border-gray-700 dark:bg-gray-900 dark:focus:ring-blue-950"
        />
      </div>

      <div>
        <label for="contact-email" class="mb-1.5 block text-sm font-bold">E-Mail-Adresse *</label>
        <input
          id="contact-email"
          name="email"
          type="email"
          required
          autocomplete="email"
          class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100 dark:border-gray-700 dark:bg-gray-900 dark:focus:ring-blue-950"
        />
      </div>
    </div>

    <div>
      <label for="contact-phone" class="mb-1.5 block text-sm font-bold">Telefonnummer *</label>
      <input
        id="contact-phone"
        name="telefon"
        type="tel"
        required
        autocomplete="tel"
        inputmode="tel"
        placeholder="Deine Telefonnummer"
        class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100 dark:border-gray-700 dark:bg-gray-900 dark:focus:ring-blue-950"
      />
    </div>

    <div>
      <label for="contact-organization" class="mb-1.5 block text-sm font-bold">
        Verein <span class="font-normal text-gray-500">(optional)</span>
      </label>
      <input
        id="contact-organization"
        name="organization"
        type="text"
        autocomplete="organization"
        class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100 dark:border-gray-700 dark:bg-gray-900 dark:focus:ring-blue-950"
      />
    </div>

    <div>
      <label for="contact-message" class="mb-1.5 block text-sm font-bold">Ihre Nachricht *</label>
      <textarea
        id="contact-message"
        name="message"
        required
        minlength="10"
        rows="4"
        [value]="message()"
        class="w-full resize-y rounded-xl border border-gray-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100 dark:border-gray-700 dark:bg-gray-900 dark:focus:ring-blue-950"
      ></textarea>
    </div>

    <button
      type="submit"
      class="inline-flex w-full items-center justify-center gap-2 rounded-2xl bg-blue-600 px-6 py-3.5 font-bold text-white shadow-lg shadow-blue-600/20 transition-all hover:-translate-y-0.5 hover:bg-blue-700 focus:outline-none focus-visible:ring-4 focus-visible:ring-blue-300 dark:focus-visible:ring-blue-900"
    >
      Nachricht direkt senden
      <span aria-hidden="true">→</span>
    </button>
    <p class="text-center text-[11px] leading-relaxed text-gray-500">
      Ihre Angaben werden zum Versand über den Formulardienst FormSubmit übermittelt.
    </p>
  </form>
</div>
