<header
  class="sticky top-0 z-50 w-full border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-black/80 backdrop-blur-md transition-colors duration-300"
>
  <div class="container mx-auto flex h-14 items-center justify-between px-6 sm:px-12 lg:px-20">
    <div class="flex items-center gap-2">
      <a
        routerLink="/"
        class="text-lg font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent"
      >
        Sonja Waldenspuhl
      </a>
    </div>

    <nav class="hidden md:flex items-center gap-8">
      <a
        [routerLink]="['/']"
        fragment="services"
        class="relative text-xs font-bold text-gray-600 dark:text-gray-300 hover:text-blue-500 transition-colors group"
      >
        Leistungen
        <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-blue-500 transition-all group-hover:w-full"></span>
      </a>
      <a
        [routerLink]="['/']"
        fragment="projects"
        class="relative text-xs font-bold text-gray-600 dark:text-gray-300 hover:text-blue-500 transition-colors group"
      >
        Projekte
        <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-blue-500 transition-all group-hover:w-full"></span>
      </a>
      <a
        [routerLink]="['/']"
        fragment="about"
        class="relative text-xs font-bold text-gray-600 dark:text-gray-300 hover:text-blue-500 transition-colors group"
      >
        Über mich
        <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-blue-500 transition-all group-hover:w-full"></span>
      </a>
      <a
        [routerLink]="['/']"
        fragment="credentials"
        class="relative text-xs font-bold text-gray-600 dark:text-gray-300 hover:text-blue-500 transition-colors group"
      >
        Nachweise
        <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-blue-500 transition-all group-hover:w-full"></span>
      </a>
      <a
        [routerLink]="['/']"
        fragment="contact"
        class="relative text-xs font-bold text-gray-600 dark:text-gray-300 hover:text-blue-500 transition-colors group"
      >
        Kontakt
        <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-blue-500 transition-all group-hover:w-full"></span>
      </a>
    </nav>

    <div class="flex items-center gap-4">
      <div class="flex items-center rounded-lg bg-gray-100 p-1 text-[11px] font-bold dark:bg-gray-800" aria-label="Sprache auswählen">
        <button type="button" (click)="languageService.setLanguage('de')" class="rounded-md px-2 py-1 transition-colors" [class.bg-white]="languageService.language() === 'de'" [class.text-blue-600]="languageService.language() === 'de'" [class.shadow-sm]="languageService.language() === 'de'" [class.dark:bg-gray-700]="languageService.language() === 'de'">DE</button>
        <button type="button" (click)="languageService.setLanguage('en')" class="rounded-md px-2 py-1 transition-colors" [class.bg-white]="languageService.language() === 'en'" [class.text-blue-600]="languageService.language() === 'en'" [class.shadow-sm]="languageService.language() === 'en'" [class.dark:bg-gray-700]="languageService.language() === 'en'">EN</button>
      </div>
      <button
        (click)="themeService.toggleDarkMode()"
        class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:ring-2 ring-gray-200 dark:ring-gray-700 transition-all"
      >
        @if (themeService.darkMode()) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-5 h-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M3 12h2.25m.386-6.364l1.591 1.591M12 18.75a6.75 6.75 0 100-13.5 6.75 6.75 0 000 13.5z"
            />
          </svg>
        } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-5 h-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"
            />
          </svg>
        }
      </button>
      <button
        (click)="toggleMenu()"
        class="md:hidden p-2 text-gray-600 dark:text-gray-300"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-6 h-6"
        >
          @if (!isMenuOpen) {
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
            />
          } @else {
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"
            />
          }
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  @if (isMenuOpen) {
    <div class="md:hidden border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-black">
      <nav class="flex flex-col p-4 space-y-4">
        <a
          [routerLink]="['/']"
          fragment="services"
          (click)="isMenuOpen = false"
          class="text-base font-medium text-gray-600 dark:text-gray-300 hover:text-blue-400"
          >Leistungen</a
        >
        <a
          [routerLink]="['/']"
          fragment="projects"
          (click)="isMenuOpen = false"
          class="text-base font-medium text-gray-600 dark:text-gray-300 hover:text-blue-400"
          >Projekte</a
        >
        <a
          [routerLink]="['/']"
          fragment="about"
          (click)="isMenuOpen = false"
          class="text-base font-medium text-gray-600 dark:text-gray-300 hover:text-blue-400"
          >Über mich</a
        >
        <a
          [routerLink]="['/']"
          fragment="credentials"
          (click)="isMenuOpen = false"
          class="text-base font-medium text-gray-600 dark:text-gray-300 hover:text-blue-400"
          >Nachweise</a
        >
        <a
          [routerLink]="['/']"
          fragment="contact"
          (click)="isMenuOpen = false"
          class="text-base font-medium text-gray-600 dark:text-gray-300 hover:text-blue-400"
          >Kontakt</a
        >
      </nav>
    </div>
  }
</header>
