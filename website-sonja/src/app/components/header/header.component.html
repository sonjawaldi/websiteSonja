<header
  class="sticky top-0 z-50 w-full border-b border-white/40 bg-white/80 shadow-[0_1px_20px_rgba(15,23,42,0.04)] backdrop-blur-xl dark:border-white/10 dark:bg-gray-950/80"
>
  <div class="container mx-auto flex h-16 items-center justify-between px-6 sm:px-12 lg:px-20">
    <a routerLink="/" fragment="home" class="flex items-center gap-2.5" aria-label="Startseite">
      <img src="favicon.png" alt="" width="44" height="44" class="h-11 w-11 object-contain" />
      <span
        class="bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500 bg-clip-text text-lg font-extrabold tracking-tight text-transparent"
      >
        Sonja Waldenspuhl
      </span>
    </a>

    <div class="ml-auto flex items-center gap-2">
      <nav class="section-nav hidden items-center lg:flex" aria-label="Hauptnavigation">
        @for (item of navigationItems; track item.fragment) {
          <a
            routerLink="/"
            [fragment]="item.fragment"
            (click)="closeMenus(item.fragment)"
            class="section-nav-link"
          >
            {{ item.label }}
          </a>
        }
      </nav>

      <div
        class="ml-2 flex items-center rounded-xl border border-slate-200/80 bg-slate-100/80 p-1 text-[11px] font-bold dark:border-white/10 dark:bg-white/5"
        aria-label="Sprache auswählen"
        role="group"
      >
        <button
          type="button"
          (click)="languageService.setLanguage('de')"
          class="rounded-md px-2 py-1"
          [attr.aria-pressed]="languageService.language() === 'de'"
          [class.bg-white]="languageService.language() === 'de'"
          [class.text-blue-600]="languageService.language() === 'de'"
          [class.dark:bg-gray-700]="languageService.language() === 'de'"
        >
          DE
        </button>
        <button
          type="button"
          (click)="languageService.setLanguage('en')"
          class="rounded-md px-2 py-1"
          [attr.aria-pressed]="languageService.language() === 'en'"
          [class.bg-white]="languageService.language() === 'en'"
          [class.text-blue-600]="languageService.language() === 'en'"
          [class.dark:bg-gray-700]="languageService.language() === 'en'"
        >
          EN
        </button>
      </div>

      <button
        type="button"
        (click)="themeService.toggleDarkMode()"
        class="rounded-xl border border-slate-200/80 bg-slate-100/80 p-2 text-slate-600 dark:border-white/10 dark:bg-white/5 dark:text-slate-300"
        aria-label="Farbschema wechseln"
      >
        @if (themeService.darkMode()) {
          <span aria-hidden="true">☀</span>
        } @else {
          <span aria-hidden="true">☾</span>
        }
      </button>

      <button
        type="button"
        (click)="toggleMenu()"
        class="rounded-xl p-2 text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-white/10 lg:hidden"
        aria-label="Navigation öffnen oder schließen"
        [attr.aria-expanded]="isMenuOpen"
      >
        <span class="text-xl" aria-hidden="true">{{ isMenuOpen ? '×' : '☰' }}</span>
      </button>
    </div>
  </div>

  @if (isMenuOpen) {
    <nav
      class="grid gap-1 border-t border-slate-200/70 bg-white/95 p-4 dark:border-white/10 dark:bg-gray-950/95 lg:hidden"
      aria-label="Mobile Hauptnavigation"
    >
      @for (item of navigationItems; track item.fragment) {
        <a
          routerLink="/"
          [fragment]="item.fragment"
          (click)="closeMenus(item.fragment)"
          class="mobile-nav-item"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  }
</header>
