<section class="py-12 bg-gray-50/70 dark:bg-white/[0.015]">
  <div>
    <div class="text-center mb-7">
      <span class="text-[10px] font-bold tracking-[0.2em] text-blue-500/70 uppercase"
        >Nachweise</span
      >
      <h2 class="mt-2 text-2xl font-black text-gray-900 dark:text-white">
        Kompetenz und Engagement
      </h2>
    </div>
    <div class="grid gap-4 md:grid-cols-2">
      <a
        href="zertifikat-sonjawaldenspuhl.pdf"
        target="_blank"
        rel="noopener noreferrer"
        class="group p-5 rounded-2xl bg-white dark:bg-gray-950 border border-gray-100 dark:border-white/5 hover:border-blue-500/40 shadow-sm transition-all"
      >
        <div class="text-xs font-bold uppercase tracking-widest text-blue-500 mb-2">
          Fachkompetenz
        </div>
        <h3 class="font-black text-gray-900 dark:text-white">Skill-Zertifikat</h3>
        <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
          Zertifikat direkt im Browser ansehen.
        </p>
        <span
          class="inline-block mt-4 text-sm font-bold text-blue-600 dark:text-blue-400 group-hover:translate-x-1 transition-transform"
          >Nachweis öffnen →</span
        >
      </a>
      <button
        type="button"
        (click)="showEspkuProof = true"
        class="group p-5 text-left rounded-2xl bg-white dark:bg-gray-950 border border-gray-100 dark:border-white/5 hover:border-purple-500/40 shadow-sm transition-all"
      >
        <div class="text-xs font-bold uppercase tracking-widest text-purple-500 mb-2">
          Engagement
        </div>
        <h3 class="font-black text-gray-900 dark:text-white">ESPKU-Podiumsdiskussion</h3>
        <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
          Teilnahmenachweis geschützt ansehen.
        </p>
        <span
          class="inline-block mt-4 text-sm font-bold text-purple-600 dark:text-purple-400 group-hover:translate-x-1 transition-transform"
          >Nachweis ansehen →</span
        >
      </button>
    </div>
  </div>
</section>

@if (showEspkuProof) {
  <div
    class="fixed inset-0 z-[60] flex items-center justify-center bg-black/85 p-4 backdrop-blur-sm"
    role="dialog"
    aria-modal="true"
    aria-label="Teilnahmenachweis ESPKU"
    (click)="showEspkuProof = false"
  >
    <div class="relative max-h-[92vh] w-full max-w-5xl" (click)="$event.stopPropagation()">
      <button
        type="button"
        class="absolute -right-2 -top-2 z-10 flex h-10 w-10 items-center justify-center rounded-full bg-white text-2xl text-gray-900 shadow-lg"
        aria-label="Ansicht schließen"
        (click)="showEspkuProof = false"
      >
        &times;
      </button>
      <div class="relative overflow-hidden rounded-2xl bg-gray-950 shadow-2xl select-none">
        <img
          src="es_pku_podiumsdiskussion_dig_pku.jpg"
          alt="Teilnahmenachweis der ESPKU-Podiumsdiskussion"
          class="mx-auto max-h-[92vh] max-w-full object-contain pointer-events-none"
          draggable="false"
        />
        <div
          class="absolute inset-0"
          aria-hidden="true"
          (contextmenu)="$event.preventDefault()"
        ></div>
      </div>
    </div>
  </div>
}
