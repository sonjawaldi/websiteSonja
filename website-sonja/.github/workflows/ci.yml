name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:ci

      - name: Build production frontend
        run: npm run build

      - name: Upload current frontend build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: dist/website-sonja/browser
          if-no-files-found: error
          retention-days: 14

      - name: Check out previous frontend version
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .frontend-baseline

      - name: Build previous frontend version
        if: github.event_name == 'pull_request'
        run: |
          npm ci --prefix .frontend-baseline
          npm run build --prefix .frontend-baseline

      - name: Upload previous frontend build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-baseline-${{ github.event.pull_request.number }}
          path: .frontend-baseline/dist/website-sonja/browser
          if-no-files-found: error
          retention-days: 14
